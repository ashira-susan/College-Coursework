name: Exp19 - CD Flask App (monorepo)

on:
  push:
    branches: [ main ]
    paths:
      - "software-engineering-csa10/Lab Experiments/Exp19-GitHub-Actions-CD-Docker/**"
  workflow_dispatch:

env:
  IMAGE_NAME: flask-cd-demo
  CONTAINER_NAME: flask-cd-demo

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
        working-directory: "software-engineering-csa10/Lab Experiments/Exp19-GitHub-Actions-CD-Docker"
      - run: python -m pytest tests -v
        working-directory: "software-engineering-csa10/Lab Experiments/Exp19-GitHub-Actions-CD-Docker"

  build-and-push:
    name: Build and push image to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: "software-engineering-csa10/Lab Experiments/Exp19-GitHub-Actions-CD-Docker"
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy container (self-hosted runner)
    needs: build-and-push
    # your own machine / VM with Docker installed and registered as a runner
    runs-on: self-hosted
    steps:
      - name: Pull latest image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
      - name: Replace running container
        run: |
          docker rm -f ${{ env.CONTAINER_NAME }} || true
          docker run -d --name ${{ env.CONTAINER_NAME }} -p 5001:5000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
      - name: Smoke test
        run: |
          sleep 5
          curl --fail http://localhost:5001/health
