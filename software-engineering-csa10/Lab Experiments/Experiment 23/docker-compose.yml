services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-service:            # same name the Kubernetes Service uses
    build: ./backend
    image: multi-backend:1.0
    environment:
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppass
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: multi-frontend:1.0
    ports:
      - "8080:80"
    depends_on:
      - backend-service

volumes:
  pgdata:
