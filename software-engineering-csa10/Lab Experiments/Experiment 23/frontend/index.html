<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3-Tier App on Kubernetes</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f3f6fb; margin:0; }
    .wrap { max-width: 640px; margin: 40px auto; background:#fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    h1 { margin-top:0; color:#0b6bcb; }
    .row { display:flex; gap:8px; margin-bottom:12px; }
    input { flex:1; padding:10px; border:1px solid #c7d0dc; border-radius:6px; }
    button { padding:10px 16px; border:0; border-radius:6px; background:#0b6bcb; color:#fff; cursor:pointer; }
    .pod { background:#eef6ff; border-left:4px solid #0b6bcb; padding:10px 12px; margin:12px 0; font-family: monospace; }
    li { padding:6px 0; border-bottom:1px solid #eef1f6; }
    small { color:#6b7686; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Frontend &rarr; Backend &rarr; Database</h1>
  <p>Nginx (frontend) &rarr; Flask API (backend, scalable) &rarr; PostgreSQL (database)</p>

  <div class="pod">Backend pod that answered: <span id="pod">...</span> (<span id="db">...</span>)</div>
  <button onclick="loadInfo()">Ask backend again (try after scaling)</button>

  <h3>Messages</h3>
  <div class="row">
    <input id="text" placeholder="Type a message and save it to the database">
    <button onclick="addMessage()">Save</button>
  </div>
  <ul id="list"></ul>
</div>

<script>
async function loadInfo() {
  const r = await fetch('/api/info', {cache: 'no-store'});
  const d = await r.json();
  document.getElementById('pod').textContent = d.pod;
  document.getElementById('db').textContent = d.database;
}
async function loadMessages() {
  const r = await fetch('/api/messages', {cache: 'no-store'});
  const rows = await r.json();
  document.getElementById('list').innerHTML = rows.map(m =>
    `<li>${m.text} <small>&mdash; saved via pod ${m.served_by}</small></li>`).join('');
}
async function addMessage() {
  const el = document.getElementById('text');
  if (!el.value.trim()) return;
  await fetch('/api/messages', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({text: el.value})});
  el.value = '';
  loadMessages(); loadInfo();
}
loadInfo(); loadMessages();
</script>
</body>
</html>
