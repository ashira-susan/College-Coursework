<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flask To-Do (Docker)</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f3f6fb; margin:0; }
    .wrap { max-width: 560px; margin: 40px auto; background:#fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    h1 { margin-top:0; color:#0b6bcb; }
    form.add { display:flex; gap:8px; margin-bottom:16px; }
    form.add input { flex:1; padding:10px; border:1px solid #c7d0dc; border-radius:6px; }
    button { padding:8px 14px; border:0; border-radius:6px; background:#0b6bcb; color:#fff; cursor:pointer; }
    button.del { background:#d64545; }
    button.tog { background:#2e9e5b; }
    ul { list-style:none; padding:0; }
    li { display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid #eef1f6; }
    li span { flex:1; }
    li.done span { text-decoration: line-through; color:#8a94a3; }
    form.inline { margin:0; }
    .meta { color:#6b7686; font-size:.9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>To-Do List</h1>
    <p class="meta">{{ pending }} pending &middot; {{ tasks|length }} total</p>
    <form class="add" method="post" action="{{ url_for('add') }}">
      <input name="title" placeholder="What needs to be done?" required>
      <button type="submit">Add</button>
    </form>
    <ul>
      {% for t in tasks %}
      <li class="{{ 'done' if t['done'] else '' }}">
        <span>{{ t['title'] }}</span>
        <form class="inline" method="post" action="{{ url_for('toggle', task_id=t['id']) }}">
          <button class="tog" type="submit">{{ 'Undo' if t['done'] else 'Done' }}</button>
        </form>
        <form class="inline" method="post" action="{{ url_for('delete', task_id=t['id']) }}">
          <button class="del" type="submit">Delete</button>
        </form>
      </li>
      {% else %}
      <li><span class="meta">No tasks yet - add one above.</span></li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
